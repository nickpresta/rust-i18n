name: Packed translations benchmark

on:
  workflow_dispatch:
    inputs:
      tiers:
        description: Benchmark tiers to run (comma separated)
        required: true
        default: small,medium,large
        type: string
      runtime_trials:
        description: Runtime trials per build sample
        required: true
        default: '5'
        type: string
  push:
    branches:
      - nick/packed-translation-benchmark-ci

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: longbridge/rust-i18n
          ref: fb1deb45f4fafa8fec708d97051a3a0031d2cd5c
          path: upstream-main
      - uses: actions/checkout@v4
        with:
          repository: nickpresta/rust-i18n
          ref: 538b338c76ccace3758545deeb29a1b76b19de24
          path: pr-candidate
      - name: Record runner resources
        run: |
          test "$(git -C upstream-main rev-parse HEAD)" = fb1deb45f4fafa8fec708d97051a3a0031d2cd5c
          test "$(git -C pr-candidate rev-parse HEAD)" = 538b338c76ccace3758545deeb29a1b76b19de24
          rustc -Vv
          cargo -V
          free -h
          df -h .
      - name: Run serialized benchmark matrix
        env:
          BENCH_TIERS: ${{ inputs.tiers || 'small,medium,large' }}
          BENCH_RUNTIME_TRIALS: ${{ inputs.runtime_trials || '5' }}
        run: |
          python3 benchmarks/packed_translations/run_matrix.py \
            --main "$GITHUB_WORKSPACE/upstream-main" \
            --candidate "$GITHUB_WORKSPACE/pr-candidate" \
            --work-dir "$RUNNER_TEMP/packed-translations" \
            --tiers "$BENCH_TIERS" \
            --runtime-trials "$BENCH_RUNTIME_TRIALS" \
            --max-rss-gib 9 \
            --max-seconds 900 \
            --min-disk-gib 2 \
            --min-swap-mib 0 \
            --min-memory-percent 15 \
            --warm-online
      - name: Save benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-translations-results
          path: |
            ${{ runner.temp }}/packed-translations/metadata.json
            ${{ runner.temp }}/packed-translations/results.jsonl
            ${{ runner.temp }}/packed-translations/*.log
          if-no-files-found: warn
          retention-days: 14

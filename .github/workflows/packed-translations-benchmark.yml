name: Packed translations benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - nick/packed-translation-benchmark-ci

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: longbridge/rust-i18n
          ref: fb1deb45f4fafa8fec708d97051a3a0031d2cd5c
          path: upstream-main
      - uses: actions/checkout@v4
        with:
          repository: nickpresta/rust-i18n
          ref: dac0cac8f9dd10a166bfef4c377f541ec6faefc7
          path: pr-candidate
      - name: Record runner resources
        run: |
          test "$(git -C upstream-main rev-parse HEAD)" = fb1deb45f4fafa8fec708d97051a3a0031d2cd5c
          test "$(git -C pr-candidate rev-parse HEAD)" = dac0cac8f9dd10a166bfef4c377f541ec6faefc7
          rustc -Vv
          cargo -V
          free -h
          df -h .
      - name: Run serialized benchmark matrix
        run: |
          python3 benchmarks/packed_translations/run_matrix.py \
            --main "$GITHUB_WORKSPACE/upstream-main" \
            --candidate "$GITHUB_WORKSPACE/pr-candidate" \
            --work-dir "$RUNNER_TEMP/packed-translations" \
            --tiers small,medium,large \
            --runtime-trials 0 \
            --max-rss-gib 9 \
            --max-seconds 900 \
            --min-disk-gib 2 \
            --min-swap-mib 0 \
            --min-memory-percent 15 \
            --warm-online
      - name: Save benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-translations-results
          path: |
            ${{ runner.temp }}/packed-translations/metadata.json
            ${{ runner.temp }}/packed-translations/results.jsonl
            ${{ runner.temp }}/packed-translations/*.log
          if-no-files-found: warn
          retention-days: 14
